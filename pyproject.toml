[project]
name = "svval"
version = "0.1.0"
description = "SV data validation of the KUCMS data ntuples: per-year / per-era health plots in the SV control regions"
# 3.9: runs in the LPC CMSSW_15_1_0_patch5 python (uproot, awkward, hist, ROOT come from there)
requires-python = ">=3.9"
dependencies = ["uproot>=5", "awkward>=2", "numpy", "hist>=2.7", "pyyaml"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
svval = "svval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
